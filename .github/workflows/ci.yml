# Integración continua: comprueba tipos, tests (perft y IA) y build en cada push y pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (perft, reglas e IA)
        run: npm test
      - name: Tipos y build de producción
        run: npm run build
